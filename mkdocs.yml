site_name: Torizon OS Layer Documentation
site_description: >-
  Unified documentation for the Torizon OS Yocto layers: meta-torizon (distro)
  and meta-torizon-bsp (BSP adaptations).
# User GitHub Pages site: served at the domain root (no project subpath).
site_url: https://torizon.github.io/

# Test deployment repo. The per-vendor guides under docs/common-torizon/ are a
# committed snapshot generated by scripts/sync-external-docs.sh from the layer
# repos; in production they are aggregated at build time (see README).
repo_url: https://github.com/torizon/torizon.github.io
repo_name: torizon/torizon.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/torizon.png
  favicon: assets/torizon.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy
    - search.suggest
  # Dark theme only (no light scheme / no toggle). Forces dark regardless of the
  # visitor's OS prefers-color-scheme. To offer light again, restore a two-entry
  # palette list with per-entry `media` + `toggle` blocks.
  palette:
    scheme: slate
    primary: indigo
    accent: green

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - tables

nav:
  - Home: index.md
  - Architecture & Migration: architecture-migration.md
  - Building Torizon OS: building-torizon.md
  - Common Torizon (per-vendor):
      - Intel x86-64: common-torizon/README-x86.md
      - NVIDIA Jetson Orin: common-torizon/README-nvidia.md
      - NXP i.MX: common-torizon/README-nxp.md
      - Renesas RZ/V2L: common-torizon/README-rzv2l.md
      - STMicroelectronics STM32MP: common-torizon/README-stm32mp.md
      - Synaptics Astra/Luna: common-torizon/README-syn.md
      - Texas Instruments AM62x: common-torizon/README-ti.md
  - Contributing: contributing.md
  - Development Process: development-process.md
  - Reporting Issues: reporting-issues.md
  - License: license.md
