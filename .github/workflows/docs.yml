name: Build and deploy docs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # This test repo commits the per-vendor guides under docs/common-torizon/,
      # so the site builds standalone. In production, uncomment the two steps
      # below (and add the layer submodules) to aggregate the docs at build time:
      #   - uses: actions/checkout@v4 with: { submodules: recursive }
      #   - run: ./scripts/sync-external-docs.sh
      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
